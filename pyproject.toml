[project]
name = "aidemo-companion"
version = "0.0.1"
description = "陪伴型 agent MVP：MiniMax + Telegram + memU"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "memu-py",
    # 本地 embedding server（MiniMax embedding 非 OpenAI 兼容，memU 不认）
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    # 主聊天可切到 Claude；memU 内部仍走 MiniMax
    "anthropic>=0.97",
]

[project.optional-dependencies]
# memU self-hosted 若要 postgres 持久化，再装 psycopg + pgvector
persist = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
