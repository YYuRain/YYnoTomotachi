[project]
name = "aidemo-companion"
version = "0.0.2"
description = "陪伴型 agent：自搭记忆栈 + Telegram + 多 LLM provider"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    # 自搭记忆栈：postgres + pgvector
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # 本地 embedding server
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    # 主聊天 LLM provider
    "anthropic>=0.97",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
