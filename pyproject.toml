[project]
name = "aidemo-companion"
version = "0.0.2"
description = "陪伴型 agent：自搭记忆栈 + Telegram + 多 LLM provider"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    # 自搭记忆栈：postgres + pgvector
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # 本地 embedding server
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    # 主聊天 LLM provider
    "anthropic>=0.97",
]

[project.optional-dependencies]
# Agent-Reach 工具集（2026-05-21 接入）：YouTube/B站字幕（yt-dlp）+ 小红书（xhs CLI）
# 装法：pip install -e ".[tools]"  或 Dockerfile 显式 pip install yt-dlp xhs
# 注意：gh CLI 是 GitHub 官方二进制，不是 Python 包——Dockerfile 里 curl 下载
tools = [
    "yt-dlp>=2024.12.0",
    "xiaohongshu-cli",  # jackwener/xiaohongshu-cli；注册 'xhs' 命令；带签名
    "bilibili-cli",     # jackwener/bilibili-cli；注册 'bili' 命令；搜索/视频详情
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
