services:
  mihomo:
    # Clash 内核（开源 mihomo）。HK 服务器需要它把 OpenRouter / Anthropic 调用转出去
    # （某些区域 IP 被 Anthropic 限制）。订阅 yaml 挂在 ./clash-config.yaml
    image: metacubex/mihomo:latest
    container_name: aidemo-mihomo
    restart: unless-stopped
    volumes:
      - ./clash-config.yaml:/root/.config/mihomo/config.yaml:ro
    # 不暴露端口到宿主——只在 compose 内网由 bot/admin 访问 mihomo:9981

  postgres:
    image: pgvector/pgvector:pg16
    container_name: memu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memu
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 不暴露端口到宿主机；只在 compose 内网通；admin 想本地连数据库可加 ports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memu"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: aidemo-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mihomo:
        condition: service_started
    env_file: .env
    environment:
      # 容器内连同网内的 postgres
      MEMU_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/memu
      # bge 模型在镜像 build 时已下载到 /opt/hf/bge-small-zh-v1.5（不是 HF cache 布局），
      # 直接给 SentenceTransformer 绝对路径，避开 cache 找不到
      EMBED_MODEL_NAME: /opt/hf/bge-small-zh-v1.5
      # 出口走 compose 内网 mihomo（Clash 订阅，US 节点）；Anthropic 模型对 HK IP 403
      TELEGRAM_PROXY: http://mihomo:9981
    volumes:
      - ./data:/app/data
      # 2026-05-21 起 prompt/system_baseline.md 已在镜像里（COPY . .）；删了 stale mount
      - ./data/.xhs-cookie:/root/.xiaohongshu-cli   # xhs CLI (jackwener) cookie 持久化；rebuild 不丢
      - cf-shared:/shared:ro   # 读 cloudflared 写的 admin URL（/admin 命令用）
      # 2026-05-28：agent_self.py L4 自治需要跑 git log 看 prompt 时间线（对齐 audit 事件）。
      # .git 在 .dockerignore 里没烤进镜像；只读 mount 解决，给 reflection LLM 看 prompt 改了啥
      - ./.git:/app/.git:ro
    # 不暴露端口；bot 是出站连接

  admin:
    build: .
    container_name: aidemo-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      MEMU_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/memu
    volumes:
      # 改成读写：admin 现在要 UPDATE prompt_overrides / skills 表（approve/reject/disable）
      - ./data:/app/data
    command: ["python", "-m", "scripts.admin"]
    ports:
      # 仅绑 loopback——cloudflared 同 compose 内网走 admin:18081 不受影响。
      # 之前 0.0.0.0 公开监听 + dev 默认免鉴权兜底 = 生产忘配密码会裸奔。
      # 真要从外部直连，走 SSH 隧道：ssh -L 18081:127.0.0.1:18081 hk
      - "127.0.0.1:18081:18081"

  cloudflared:
    # 给 admin UI 一个临时的 https://<random>.trycloudflare.com URL（HTTPS、零配置、不开端口）。
    # cloudflared 用 --logfile 把启动日志（含分配到的 URL）写到 /shared/cf.log；
    # bot 的 /admin 命令读这个文件 grep 出当前 URL 返回。restart 后 URL 会变 → 重新 /admin。
    # user: 0:0 是因为 distroless 镜像默认 nonroot，写不了 root-owned 的 named volume
    image: cloudflare/cloudflared:latest
    container_name: aidemo-cloudflared
    restart: unless-stopped
    user: "0:0"
    depends_on:
      - admin
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://admin:18081
      - --logfile
      - /shared/cf.log
    volumes:
      - cf-shared:/shared

volumes:
  pg-data:
  cf-shared:
